name: PR Validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node tools/test-room-flow.mjs
      - run: node tools/test-lobby.mjs

      - run: node tools/test-mobile-typography.mjs

      - run: node tools/test-mobile-presenters.mjs
      - run: node tools/test-realtime-proxy.mjs
      - run: node tools/test-battle-report.mjs
