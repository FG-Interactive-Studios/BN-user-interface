name: Import Figma artwork (one time)
on:
  push:
    branches: [feature/figma-new-ui-v1]
permissions:
  contents: write
jobs:
  import:
    if: "!contains(github.event.head_commit.message, '[assets synced]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/figma-new-ui-v1
          persist-credentials: true
      - name: Download original Figma images to the repository
        run: |
          set -euo pipefail
          mkdir -p src/assets/figma
          if [ -f src/assets/figma/storm.jpg ]; then
            echo 'Original artwork already present'
            exit 0
          fi
          curl -fL --retry 3 --connect-timeout 10 --max-time 90 -o src/assets/figma/storm.jpg 'https://www.figma.com/api/mcp/asset/b7f7cccf-77b6-4040-8838-39654d22c269'
          curl -fL --retry 3 --connect-timeout 10 --max-time 90 -o src/assets/figma/gold-coin.png 'https://www.figma.com/api/mcp/asset/95049a71-3cc5-46cf-90ae-f2888674d841/2b4f0.png'
          curl -fL --retry 3 --connect-timeout 10 --max-time 90 -o src/assets/figma/blue-coin.png 'https://www.figma.com/api/mcp/asset/95049a71-3cc5-46cf-90ae-f2888674d841/c6814.png'
          file src/assets/figma/storm.jpg src/assets/figma/gold-coin.png src/assets/figma/blue-coin.png
          test "$(wc -c < src/assets/figma/storm.jpg)" -gt 30000
          test "$(wc -c < src/assets/figma/gold-coin.png)" -gt 3000
          test "$(wc -c < src/assets/figma/blue-coin.png)" -gt 3000
      - name: Commit binary assets
        run: |
          if git status --porcelain src/assets/figma | grep -q .; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/assets/figma
            git commit -m 'chore(ui): commit original Figma artwork [assets synced]'
            git push origin HEAD:feature/figma-new-ui-v1
          fi
