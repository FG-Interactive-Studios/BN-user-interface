name: Deploy to Firebase Hosting on merge
# Production release is intentionally a manual action.
# Merging feature PRs must not deploy the public live website.
on:
  workflow_dispatch:
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci && npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NAVIIWAR }}
          channelId: live
          projectId: naviiwar
