name: Deploy to Firebase Hosting on merge
# Publish production on main updates; allow manual redeploys from main.
on:
  push:
    branches:
      - main
  workflow_dispatch:
concurrency:
  group: firebase-hosting-live
  cancel-in-progress: false
jobs:
  build_and_deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with production API configuration
        run: |
          test -n "$VITE_API_URL" || { echo 'Missing VITE_API_URL repository variable'; exit 1; }
          test -n "$VITE_WS_URL" || { echo 'Missing VITE_WS_URL repository variable'; exit 1; }
          npm ci
          npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_WS_URL: ${{ vars.VITE_WS_URL }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NAVIIWAR }}
          channelId: live
          projectId: naviiwar
