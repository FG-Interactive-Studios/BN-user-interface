name: Figma responsive browser check
on:
  pull_request:
    paths:
      - 'src/prototype/**'
      - 'tools/test-figma-viewport.mjs'
      - 'tools/test-figma-combat-mobile.mjs'
      - '.github/workflows/figma-responsive-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright for CI only
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check mobile and desktop actual geometry
        run: node tools/test-figma-viewport.mjs
      - name: Check mobile placement and battle geometry
        run: node tools/test-figma-combat-mobile.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: figma-responsive-captures
          path: |
            artifacts/figma-responsive/
            artifacts/figma-combat/
          if-no-files-found: ignore
          retention-days: 7
